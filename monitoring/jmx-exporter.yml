# JMX exporter rules for Debezium connector metrics.
# MBean names look like:
#   debezium.postgres:type=connector-metrics,context=streaming,server=cdc
#   debezium.postgres:type=connector-metrics,context=snapshot,server=cdc
# (newer connectors may add a task tag; both shapes are covered below).
startDelaySeconds: 0
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^,]+), key=([^>]+)><>RowsScanned"
    name: "debezium_metrics_rowsscanned"
    labels:
      plugin: "$1"
      name: "$3"
      context: "$2"
      table: "$4"
  - pattern: "debezium.([^:]+)<type=connector-metrics, server=([^,>]+), task=([^,>]+), context=([^,>]+)><>([^:]+)"
    name: "debezium_metrics_$5"
    labels:
      plugin: "$1"
      name: "$2"
      task: "$3"
      context: "$4"
  - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,>]+), server=([^,>]+)><>([^:]+)"
    name: "debezium_metrics_$4"
    labels:
      plugin: "$1"
      name: "$3"
      context: "$2"
