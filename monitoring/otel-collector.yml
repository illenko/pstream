# OpenTelemetry Collector: scrapes the Prometheus-format endpoints and streams
# everything to Prometheus as OTLP (its native OTLP receiver ingests it).
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: debezium-connect
          scrape_interval: 10s
          static_configs:
            - targets: ["connect:9404"]
        - job_name: postgres-exporter
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter:9187"]

processors:
  batch: {}

exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlphttp/prometheus]
