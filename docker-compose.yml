name: pstream

services:
  postgres-source:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}
      POSTGRES_DB: ${SOURCE_DB_NAME}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-source-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_DB_USER} -d ${SOURCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-sink:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${SINK_DB_USER}
      POSTGRES_PASSWORD: ${SINK_DB_PASSWORD}
      POSTGRES_DB: ${SINK_DB_NAME}
    volumes:
      - ./postgres/sink-init:/docker-entrypoint-initdb.d:ro
      - postgres-sink-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SINK_DB_USER} -d ${SINK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  init-topics:
    image: apache/kafka:${KAFKA_VERSION}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic payments.state --partitions 6 --replication-factor 1 \
          --config cleanup.policy=compact --config min.compaction.lag.ms=60000 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic __debezium-heartbeat.cdc --partitions 1 --replication-factor 1 \
          --config retention.ms=3600000
        echo "topics ready"
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /subjects HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 10s
      retries: 24

  connect:
    build:
      context: ./connect
      args:
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}
        AVRO_CONVERTER_VERSION: ${AVRO_CONVERTER_VERSION}
    image: pstream-connect:${DEBEZIUM_VERSION}
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 36

  register-connector:
    image: pstream-connect:${DEBEZIUM_VERSION}
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./connect/payments-connector.json:/config/payments-connector.json:ro
      - ./scripts/register-connector.sh:/register-connector.sh:ro
    entrypoint: ["/bin/bash", "/register-connector.sh"]
    restart: "no"

  akhq:
    image: tchiotludo/akhq:${AKHQ_VERSION}
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      connect:
        condition: service_healthy
    volumes:
      - ./akhq/application.yml:/app/application.yml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 10s
      retries: 24

  generator:
    build:
      context: ./generator
    image: pstream-generator:local
    depends_on:
      postgres-source:
        condition: service_healthy
      register-connector:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${SOURCE_DB_USER}:${SOURCE_DB_PASSWORD}@postgres-source:5432/${SOURCE_DB_NAME}
      GEN_CREATE_INTERVAL: ${GEN_CREATE_INTERVAL}
      GEN_MAX_INFLIGHT: ${GEN_MAX_INFLIGHT}
      GEN_SEED: ${GEN_SEED}
      GEN_TENANTS: ${GEN_TENANTS}
    healthcheck:
      test: ["CMD", "pgrep", "generator"]
      interval: 5s
      timeout: 5s
      retries: 3

  sink:
    build:
      context: ./sink
    image: pstream-sink:local
    depends_on:
      postgres-sink:
        condition: service_healthy
      register-connector:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: payments.state
      GROUP: sink
      DATABASE_URL: postgres://${SINK_DB_USER}:${SINK_DB_PASSWORD}@postgres-sink:5432/${SINK_DB_NAME}
    healthcheck:
      test: ["CMD", "pgrep", "sink"]
      interval: 5s
      timeout: 5s
      retries: 3

  # One-shot tool: dumps payments.state as JSON lines (used by `make verify`)
  topicdump:
    profiles: ["tools"]
    image: pstream-sink:local
    build:
      context: ./sink
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: payments.state
    entrypoint: ["/usr/local/bin/topicdump"]

volumes:
  postgres-source-data:
  postgres-sink-data:
  kafka-data:
